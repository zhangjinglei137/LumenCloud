name: docker-branch

on:
  push:
    branches-ignore: [main]

env:
  REGISTRY: docker.io
  IMAGE_NAME: thntime/lumencloud

jobs:
  build-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 生成分支预览标签
        id: tag
        run: |
          BRANCH_TAG=$(echo "${GITHUB_REF_NAME}" | tr '/_' '-' | tr '[:upper:]' '[:lower:]')
          echo "branch_tag=dev-${BRANCH_TAG}" >> "$GITHUB_OUTPUT"

      - name: 设置 QEMU（多架构）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送分支预览镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.branch_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=lumencloud
