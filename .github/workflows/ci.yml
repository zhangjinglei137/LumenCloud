name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-check:
    name: Backend 导入检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        working-directory: backend
        run: pip install -r requirements.txt

      - name: 语法与导入检查
        working-directory: backend
        run: |
          python -m compileall -q app
          python -c "import app.main" || true  # 首次骨架阶段允许部分模块缺失，仅作 smoke

  frontend-build:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 构建
        working-directory: frontend
        run: npm run build

  trivy-scan:
    name: 镜像安全扫描（trivy）
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: 构建镜像（仅扫描用）
        run: docker build -t lumencloud:scan .

      - name: 运行 Trivy 扫描
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: lumencloud:scan
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: 上传 SARIF 到 GitHub
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
