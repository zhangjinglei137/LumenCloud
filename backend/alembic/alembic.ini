# LumenCloud Alembic 配置
# - 建表 DDL 权威来源：versions/ 手写迁移脚本（与 backend/app/models 一一对应）
# - sqlalchemy.url 由 env.py 依据 app.config.settings.DATABASE_URL 动态推导（此处留空）
# - 运行方式（backend/ 目录下）：alembic -c alembic/alembic.ini upgrade head
[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
