# ============================================
# LumenCloud 生产部署（Docker Hub 镜像 + PostgreSQL）—— 阶段 4 + Phase 8 零 env
# 用法：
#   IMAGE_TAG=1.0.0 docker compose -f docker-compose.prod.yml up -d
#
# ★ 无需 .env.prod（Phase 8）——唯一例外是数据库密码 POSTGRES_PASSWORD（必填）：
#   1. 服务凭据（alist/cloudSaver/aria2/NasTools/Emby/TMDB/PushPlus/夸克）→
#      设置页「服务凭据配置」保存到数据库，保存即生效、无需重启；
#   2. JWT 密钥 → 首启自动生成落盘 ./data/.jwt_secret（chmod 600）；
#   3. admin 初始密码 → 首启自动生成并打印在服务日志（docker logs），
#      登录后在设置页修改（POST /api/auth/change-password）；
#   4. 数据库 → 内置 PostgreSQL 16（db 服务）数据在 ./pgdata 卷；
#      应用启动时 alembic 自动迁移建表，无需手动初始化。
#
# 生产化要点：
#   1. 健康检查：/api/health（应用）与 pg_isready（数据库）
#   2. 日志轮转：json-file driver 按 10m/5 文件轮转（admin 初始密码在 docker logs）
#   3. 资源限制：deploy.resources.limits（cpus 1.0 / memory 512M，按宿主规格调）
#   4. 数据备份：宿主 crontab 建议已存在，推荐直接使用：
#      0 3 * * * docker exec lumencloud python scripts/backup_db.py
#      （容器内 SQLite 在线备份 → /app/scripts/backup，--keep 14 自动清理旧档）
#      可选：cron 容器内定时备份（仅为命令参考，不新增 compose 服务、
#      避免引入未经测试的部署拓扑）：
#      docker run -d --name lumencloud-cron --restart unless-stopped \
#        -v /var/run/docker.sock:/var/run/docker.sock alpine:3.20 \
#        sh -c "apk add --no-cache docker-cli \
#          && echo '0 3 * * * docker exec lumencloud python scripts/backup_db.py' > /etc/crontabs/root \
#          && crond -f -l 8"
#      ⚠️ 挂载 docker.sock 等同宿主 root 权限，请自行评估安全风险
#   5. 数据库密码必须经环境变量强注入（fail-closed）：
#      POSTGRES_PASSWORD=xxxx docker compose -f docker-compose.prod.yml up -d
#      未设置时 compose 直接报错拒绝启动，杜绝硬编码弱密码进生产。
#      db 服务与 lumencloud 服务取同一变量（两处同步），改一处不如改两处。
#   6. 宿主卷权限（非 root 运行）：容器内以 UID 1000 写 /app/data；bind-mount
#      的宿主 ./data 属主由 dataprep 服务在每次 up 时自动 chown 修正（幂等），
#      无需手动干预（旧 root 实例/新机器均可直接拉起）。
#      ./pgdata 由 postgres 镜像 entrypoint 自动处理属主，无需手动 chown。
# ============================================
services:
  db:
    image: postgres:16-alpine
    container_name: lumencloud-db
    environment:
      POSTGRES_USER: lumen
      # fail-closed：未设置 POSTGRES_PASSWORD 时 compose 报错、拒绝启动
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?生产环境必须设置 POSTGRES_PASSWORD}
      POSTGRES_DB: lumencloud
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumen -d lumencloud"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  dataprep:
    # 一次性权限引导（非 root 运行配套）：容器内以 root 把 bind-mount 的宿主
    # ./data 属主修正为 UID 1000（lumencloud），解决旧 root 实例/新机器上
    # bind-mount 权限踩坑（JWT 密钥/落盘 Permission denied）。幂等、秒级完成；
    # lumencloud depends_on 等待其成功退出（service_completed_successfully）后才启动。
    image: busybox:1.36
    container_name: lumencloud-dataprep
    command: ["sh", "-c", "mkdir -p /app/data && chown -R 1000:1000 /app/data"]
    volumes:
      - ./data:/app/data
    restart: "no"

  lumencloud:
    image: thntime/lumencloud:${IMAGE_TAG:-latest}
    container_name: lumencloud
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # 连接 db 服务（compose 内服务名解析；密码与 db.environment 取同一变量）
      DATABASE_URL: postgresql+asyncpg://lumen:${POSTGRES_PASSWORD:?生产环境必须设置 POSTGRES_PASSWORD}@db:5432/lumencloud
    depends_on:
      db:
        condition: service_healthy
      dataprep:
        condition: service_completed_successfully
    volumes:
      # JWT 密钥文件（.jwt_secret）+ SQLite/备份目录等
      # 非 root 运行（UID 1000）：bind-mount 的宿主 ./data 属主由上方 dataprep
      # 服务在每次 up 时自动 chown 修正，无需手动干预。
      - ./data:/app/data
    restart: unless-stopped

    # 健康检查：/api/health 返回 200 即健康
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      start_period: 60s   # 启动含 alembic 迁移 + 前端静态加载，放宽首次窗口
      interval: 30s
      timeout: 5s
      retries: 3

    # 日志轮转：单文件 10M、最多保留 5 个文件（admin 初始密码在其中）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    # 资源限制（可选建议）：按宿主 CPU/内存规格调整，不要照抄。
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M