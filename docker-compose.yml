# ============================================
# LumenCloud 开发/本地环境 —— 零 .env 开箱即用（Phase 8）+ PostgreSQL 数据库
#
# 用法：
#   docker compose up -d --build
#   docker compose logs -f    # 首次启动 admin 初始密码打印在这里
#   docker compose down       # 停止（数据保留在 ./data 与 ./pgdata 卷）
#
# ★ 无需 .env 文件：
#   1. 服务凭据（alist/cloudSaver/aria2/NasTools/Emby/TMDB/PushPlus/夸克）→
#      设置页「服务凭据配置」保存到数据库，保存即生效、无需重启；
#   2. JWT 签名密钥 → 首启自动生成落盘 ./data/.jwt_secret（chmod 600）；
#   3. admin 初始密码 → 首启自动生成并打印在服务日志，登录后在设置页修改；
#   4. 管理员用户名 → 默认 admin（如需覆盖在下方 environment 设
#      INIT_ADMIN_USERNAME，非必需）。
#
# ★ 数据库：内置 PostgreSQL 16（db 服务），数据在 ./pgdata 卷。
#   密码可用 .env 覆盖（如 POSTGRES_PASSWORD=strongpass docker compose up -d），
#   默认 lumencloud 仅供本地开发。db 服务与 lumencloud 服务取同一变量
#   ${POSTGRES_PASSWORD:-lumencloud}——两处同步，改一处不如改两处同时生效，
#   避免凭据不一致导致连接失败。
#
# 说明：
#   - lumencloud 从 Dockerfile 构建（多阶段：前端 vite → python:3.12-slim）
#   - 应用启动时 alembic 自动迁移建表（init_db），无需手动初始化
#   - 健康检查：/api/health（lumencloud）与 pg_isready（db）
#   - dataprep：一次性权限引导（busybox 以 root chown ./data → UID 1000），
#     lumencloud 依赖其成功退出后才启动（非 root 运行配套，免手动 chown）
# ============================================
services:
  db:
    image: postgres:16-alpine
    container_name: lumencloud-db
    environment:
      POSTGRES_USER: lumen
      # 可用 .env 覆盖（生产请务必设强密码）；未设时回退默认 lumencloud（仅开发）
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumencloud}
      POSTGRES_DB: lumencloud
      TZ: Asia/Shanghai
    volumes:
      # PostgreSQL 数据目录
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumen -d lumencloud"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  dataprep:
    # 一次性权限引导（非 root 运行配套）：容器内以 root 把 bind-mount 的宿主
    # ./data 属主修正为 UID 1000（lumencloud），解决旧 root 实例/新机器上
    # bind-mount 权限踩坑（JWT 密钥/落盘 Permission denied）。幂等、秒级完成；
    # lumencloud depends_on 等待其成功退出（service_completed_successfully）后才启动。
    image: busybox:1.36
    container_name: lumencloud-dataprep
    command: ["sh", "-c", "mkdir -p /app/data && chown -R 1000:1000 /app/data"]
    volumes:
      - ./data:/app/data
    restart: "no"

  lumencloud:
    build:
      context: .
      dockerfile: Dockerfile
    image: thntime/lumencloud:dev
    container_name: lumencloud
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # 连接 db 服务（compose 内服务名解析；密码与 db.environment 取同一变量，
      # 同步改，避免两处不一致）
      DATABASE_URL: postgresql+asyncpg://lumen:${POSTGRES_PASSWORD:-lumencloud}@db:5432/lumencloud
      TZ: Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
      dataprep:
        condition: service_completed_successfully
    volumes:
      # JWT 密钥文件（.jwt_secret）+ SQLite/备份目录等
      # 非 root 运行（UID 1000）：bind-mount 的宿主 ./data 属主由上方 dataprep
      # 服务在每次 up 时自动 chown 修正，无需手动干预。
      - ./data:/app/data
    restart: unless-stopped

    # 健康检查：/api/health 返回 200 即健康
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      start_period: 60s   # 启动含 alembic 迁移 + 前端静态加载，放宽首次窗口
      interval: 30s
      timeout: 5s
      retries: 3

    # 日志轮转：单文件 10M、最多保留 5 个文件（docker logs 仍可查；admin 初始密码在其中）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    # 资源限制（可选建议，按本机规格调整）
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M
