# ============================================
# LumenCloud 开发/本地环境 —— 零 env 开箱即用（Phase 8）
#
# 用法：
#   docker compose up -d --build
#   docker compose logs -f    # 首次启动 admin 初始密码打印在这里
#   docker compose down       # 停止（数据保留在 ./data 卷）
#
# ★ 无需任何环境变量 / .env 文件：
#   1. 服务凭据（alist/cloudSaver/aria2/NasTools/Emby/TMDB/PushPlus/夸克）→
#      设置页「服务凭据配置」保存到数据库，保存即生效、无需重启；
#   2. JWT 签名密钥 → 首启自动生成落盘 ./data/.jwt_secret（chmod 600）；
#   3. admin 初始密码 → 首启自动生成并打印在服务日志，登录后在设置页修改；
#   4. 数据库 → 内置 SQLite（./data/lumencloud.db），默认即用；
#   5. 管理员用户名 → 默认 admin（如需覆盖可在下方 environment 设
#      INIT_ADMIN_USERNAME，非必需）。
#
# 说明：
#   - 本地从 Dockerfile 构建（多阶段：前端 vite → python:3.12-slim）
#   - SQLite 数据 + WAL/SHM + .jwt_secret 全部在 ./data:/app/data
#   - 健康检查 /api/health；日志 json-file 轮转（10m/5 文件）
# ============================================
services:
  lumencloud:
    build:
      context: .
      dockerfile: Dockerfile
    image: thntime/lumencloud:dev
    container_name: lumencloud
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # 全部持久化状态（lumencloud.db + WAL/SHM + .jwt_secret 密钥文件）
      - ./data:/app/data
    restart: unless-stopped

    # 健康检查：/api/health 返回 200 即健康
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      start_period: 60s   # 启动含 alembic 迁移 + 前端静态加载，放宽首次窗口
      interval: 30s
      timeout: 5s
      retries: 3

    # 日志轮转：单文件 10M、最多保留 5 个文件（docker logs 仍可查；admin 初始密码在其中）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    # 资源限制（可选建议，按本机规格调整）
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M