# ============================================
# LumenCloud 开发/本地环境（Phase 8：免 .env 配置）
#
# 用法：
#   docker compose up -d --build      # 本地构建并启动（无需 .env 文件）
#   docker compose logs -f            # 查看日志（首次启动的 admin 初始密码在这里）
#   docker compose down               # 停止（数据保留在 ./data 卷）
#
# ★ Phase 8 起无需 .env：
#   1. 服务凭据（alist/cloudSaver/aria2/NasTools/Emby/TMDB/PushPlus/夸克）→
#      设置页「服务凭据配置」保存到数据库，保存即生效、无需重启；
#   2. JWT 密钥 → 首启自动生成落盘 ./data/.jwt_secret（chmod 600），重启不失效；
#   3. admin 初始密码 → 首启自动生成并打印在服务日志，登录后在设置页修改。
#   下方 environment 段仅保留【可选】覆盖项（省略即用默认/页面配置）。
#
# 说明：
#   - 本地从 Dockerfile 构建（多阶段：前端 vite → python:3.12-slim）
#   - SQLite 数据在 ./data:/app/data（含 lumencloud.db + WAL/SHM + .jwt_secret）
#   - 健康检查 /api/health；日志 json-file 轮转（10m/5 文件）
# ============================================
services:
  lumencloud:
    build:
      context: .
      dockerfile: Dockerfile
    image: thntime/lumencloud:dev
    container_name: lumencloud
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # SQLite 数据目录（lumencloud.db + WAL/SHM + .jwt_secret 密钥文件）
      - ./data:/app/data
    # Phase 8：无需 env_file——配置全部走设置页入库；下方为可选覆盖项
    environment:
      # 留空/省略 = 内置 SQLite（存于 volume /app/data）
      - DATABASE_URL=${DATABASE_URL:-}
      # 默认 admin（可选覆盖用户名）
      - INIT_ADMIN_USERNAME=${INIT_ADMIN_USERNAME:-admin}
    restart: unless-stopped

    # 健康检查：/api/health 返回 200 即健康
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      start_period: 60s   # 启动含 alembic 迁移 + 前端静态加载，放宽首次窗口
      interval: 30s
      timeout: 5s
      retries: 3

    # 日志轮转：单文件 10M、最多保留 5 个文件（docker logs 仍可查）
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    # 资源限制（可选建议，按本机规格调整）
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
